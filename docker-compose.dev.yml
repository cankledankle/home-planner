services:
  postgres:
    image: postgres:16-alpine
    container_name: home-planner-postgres-dev
    environment:
      POSTGRES_DB: homeplanner
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  sftpgo:
    image: drakkan/sftpgo:v2.6
    container_name: home-planner-sftpgo-dev
    ports:
      - "2022:2022"      # SFTP port
      - "8081:8080"      # Web admin
    environment:
      SFTPGO_ADMIN_USERNAME: admin
      SFTPGO_ADMIN_PASSWORD: admin
      SFTPGO_DATA_PROVIDER__DRIVER: memory
      SFTPGO_HTTPD__BINDINGS__0__PORT: 8080
      SFTPGO_HTTPD__BINDINGS__0__ENABLE_WEB_ADMIN: "true"
      SFTPGO_R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      SFTPGO_R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      SFTPGO_R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      SFTPGO_R2_BUCKET_NAME: ${R2_BUCKET_NAME}
    volumes:
      - sftpgo_data:/var/lib/sftpgo
      - ./sftpgo/sftpgo.json:/etc/sftpgo/sftpgo.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  sftpgo_data: