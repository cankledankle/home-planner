# Production Docker Compose - For VPS deployment
# Usage: docker-compose -f docker-compose.prod.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: home-planner-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - home-planner
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  sftpgo:
    image: drakkan/sftpgo:v2.6-alpine
    container_name: home-planner-sftpgo
    restart: unless-stopped
    environment:
      SFTPGO_ADMIN_USERNAME: ${SFTPGO_ADMIN_USERNAME}
      SFTPGO_ADMIN_PASSWORD: ${SFTPGO_ADMIN_PASSWORD}
      SFTPGO_DATA_PROVIDER__DRIVER: memory
      SFTPGO_HTTPD__BINDINGS__0__PORT: 8080
      SFTPGO_HTTPD__BINDINGS__0__ENABLE_WEB_ADMIN: 'true'
      SFTPGO_R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      SFTPGO_R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      SFTPGO_R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      SFTPGO_R2_BUCKET_NAME: ${R2_BUCKET_NAME}
    volumes:
      - sftpgo_data:/var/lib/sftpgo
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8080/healthz']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - home-planner
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  app:
    image: ${APP_IMAGE}
    container_name: home-planner-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@home-planner-postgres:5432/${POSTGRES_DB}?sslmode=disable
      MIGRATIONS_PATH: file:///app/migrations
      PORT: 8080
      FRONTEND_URL: ${FRONTEND_URL}
      STATIC_PATH: /app/static
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME}
      SFTPGO_API_URL: http://home-planner-sftpgo:8080
      SFTPGO_ADMIN_USERNAME: ${SFTPGO_ADMIN_USERNAME}
      SFTPGO_ADMIN_PASSWORD: ${SFTPGO_ADMIN_PASSWORD}
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8080/health']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      sftpgo:
        condition: service_healthy
    networks:
      - home-planner
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  nginx:
    image: nginx:alpine
    container_name: home-planner-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      NGINX_SERVER_NAME: ${DOMAIN}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot_data:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost/health']
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      app:
        condition: service_healthy
    networks:
      - home-planner
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

  # Certbot for SSL (optional - use if you want Let's Encrypt)
  certbot:
    image: certbot/certbot:latest
    container_name: home-planner-certbot
    restart: unless-stopped
    volumes:
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - home-planner
    profiles:
      - certbot

volumes:
  postgres_data:
  sftpgo_data:
  certbot_data:
  certbot_www:

networks:
  home-planner:
    driver: bridge
